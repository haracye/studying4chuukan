<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Quiz Center — Japanese Study Notes</title>
<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--soft);font-weight:500;margin-left:10px;font-size:.85rem}
.tools{display:flex;gap:8px}
.btn{font:inherit;font-weight:600;font-size:.85rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;text-decoration:none;box-shadow:var(--sh);display:inline-block}
.btn:hover{border-color:var(--acc)}.btn:focus-visible,.find:focus-visible,select:focus-visible,.card:focus-visible,.mode:focus-visible,.ch:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}body.dark .btn.pri{color:#12151c}.btn.pri:hover{background:var(--acc2)}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}

.sub{color:var(--soft);font-size:.95rem}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:0;flex:1;box-shadow:var(--sh)}.stat b{display:block;font-size:1.4rem;line-height:1.2}.stat span{font-size:.78rem;color:var(--soft)}
.qc{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:16px 20px;margin:8px 0;box-shadow:var(--sh)}.qc:hover{border-color:var(--acc)}.qc b{display:block;font-size:1.05rem}.qc small{color:var(--soft)}.qc .ar{color:var(--acc);font-weight:700;white-space:nowrap}
.go{display:none;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);background:var(--accbg);border:1px solid var(--acc);border-radius:8px;padding:12px 18px;margin:10px 0}.go small{display:block;color:var(--acc);font-size:.7rem;font-weight:700;letter-spacing:.08em}
.find{width:100%;font:inherit;padding:11px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:14px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--sh);transition:border-color .15s}.card:hover{border-color:var(--acc)}
.n{align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:var(--acc);background:var(--accbg);border-radius:4px;padding:1px 8px}.jp{font-size:1.05rem;font-weight:600;line-height:1.45;margin-top:8px}.en{color:var(--soft);font-size:.82rem}
.meta{display:flex;gap:6px;margin-top:8px;font-size:.7rem;font-weight:600}.meta span{border-radius:4px;padding:1px 8px}.vi{background:var(--okbg);color:var(--ok)}.bs{background:var(--accbg);color:var(--acc)}
.hit{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:6px;padding:10px 14px;margin:8px 0}.hit:hover{border-color:var(--acc)}.hf{display:block;font-size:.7rem;font-weight:700;color:var(--acc)}.hs{display:block;word-break:break-word}.hs mark{background:#ffe08a;color:#1c2333;border-radius:3px;padding:0 2px}.mt{display:block;font-size:.78rem;color:var(--soft);margin-top:3px}.rh{font-weight:600;color:var(--soft);font-size:.85rem;margin:14px 2px 4px}
.foot{text-align:center;color:var(--soft);font-size:.8rem;margin-top:40px}

.wrap{max-width:720px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 0}.opts label{font-size:.78rem;font-weight:600;color:var(--soft)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}

 return{stem:T+'時間稼働する間に '+n+'回故障し、修理に合計 '+R+'時間かかりました。稼働率は何％ですか。（小数第2位を四捨五入します）',en:'The system ran '+T+' hours, failed '+n+' times, and repairs took '+R+' hours in total. What is the availability in %? (Round to 1 decimal place.)',unit:'%',tol:0.05,

  ans:fmt1(a1),wr:[fmt1(tt/(mm+tt)*100),fmt1(T/(T+R)*100),fmt1((T-R)/T*100),fmt1(a1+1)],steps:[
  {j:'MTBF を求めます。（総稼働時間 ÷ 故障回数）',e:'Find MTBF (total operating time ÷ failures).',m:'MTBF = '+T+' ÷ '+n+' = '+mm},
  {j:'MTTR を求めます。（総修理時間 ÷ 故障回数）',e:'Find MTTR (total repair time ÷ failures).',m:'MTTR = '+R+' ÷ '+n+' = '+tt},
  {j:'稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）を計算します。',e:'Calculate availability = MTBF ÷ (MTBF + MTTR).',m:mm+' ÷ ('+mm+' + '+tt+') = '+mm+' ÷ '+(mm+tt)+' = '+r6(mm/(mm+tt))+' -> '+fmt1(a1)+' %'}]}}};
function pick3(r,pool,n){return r.s(pool).slice(0,n)}
MT.series={ch:'13',tag:'Series system',f:function(r){
 var n=r.i(2,3),R=pick3(r,[0.5,0.6,0.7,0.8,0.9,0.95,0.99],n),p=1,i;R.forEach(function(x){p=r6(p*x)});
 var par=1;R.forEach(function(x){par=par*(1-x)});par=r6(1-par);

 return{stem:'稼働率が '+names.map(function(x,i){return x+' は '+R[i]}).join('、')+' の装置を、直列につなぎました。システム全体の稼働率は？',en:'Devices '+names.map(function(x,i){return x+' = '+R[i]}).join(', ')+' are connected in series. What is the availability of the whole system?',

 R.forEach(function(x){var q=r6(1-x);fl.push(q);f=r6(f*q)});var ans=r6(1-f),ser=1;R.forEach(function(x){ser=r6(ser*x)});
 var names=['A','B','C'].slice(0,n);
 return{stem:'稼働率が '+names.map(function(x,i){return x+' は '+R[i]}).join('、')+' の装置を、並列につなぎました。システム全体の稼働率は？',en:'Devices '+names.map(function(x,i){return x+' = '+R[i]}).join(', ')+' are connected in parallel. What is the availability of the whole system?',

/* ===== builders / plumbing ===== */
function mathTypes(chs){return Object.keys(MT).filter(function(k){return!chs||chs.indexOf(MT[k].ch)>=0})}
function mathQ(id,seed){var T=MT[id],r=M(seed),p=T.f(r),m=mk(r,p.ans,p.wr||[],p.kind||'num');
 return{k:'k'+id+':'+seed,t:'k',tag:'Math · '+T.tag,ch:T.ch,stem:p.stem,en:p.en,code:p.code,hint:p.hint,hen:p.hen,c:m.c,a:m.a,ans:p.ans,kind:p.kind||'num',tol:p.tol||0,unit:p.unit||'',steps:p.steps,typed:false}}
function mathSet(n,chs,typed){var ids=mathTypes(chs),qs=[],seen={},bag=[],g=0;
 while(qs.length<n&&g++<n*30&&ids.length){if(!bag.length)bag=shuf(ids.slice());var id=bag.pop(),q=mathQ(id,1+Math.floor(Math.random()*899999));if(seen[q.stem])continue;seen[q.stem]=1;if(typed){q.typed=true;q.c=null}qs.push(q)}
 return qs}
function mathWrong(){var o=[];Object.keys(wrong).forEach(function(k){if(k[0]!=='k')return;var p=k.slice(1).split(':');if(MT[p[0]])o.push(mathQ(p[0],+p[1]))});return o}
function normA(s){return String(s).normalize('NFKC').replace(/[\s,，、％%]/g,'').replace(/[−‐–ー]/g,'-').toUpperCase()}
function mathOK(q,s){var a=normA(s),b=normA(q.ans);if(!a)return false;
 if(q.kind==='bin')return a.replace(/^0+(?=.)/,'')===b.replace(/^0+(?=.)/,'');
 if(q.kind==='str')return a===b;
 var x=parseFloat(a),y=parseFloat(b);if(isNaN(x)||!/^-?[\d.]+$/.test(a))return false;return Math.abs(x-y)<=(q.tol||1e-9*Math.max(1,Math.abs(y)))}
function mathExplain(q){var h='Answer: <b>'+mfur(q.ans+q.unit,false)+'</b><div class="sol"><div class="sh">How to solve</div><ol class="steps">';
 q.steps.forEach(function(s){h+='<li><div class="sj">'+mfur(s.j,true)+'</div><div class="se">'+esc(s.e)+'</div>'+(s.m?'<pre class="calc">'+esc(s.m)+'</pre>':'')+'</li>'});
 return h+'</ol></div>'}
